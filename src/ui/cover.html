<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; font-src 'self' file:; img-src data: file: https:">
  <title>painel</title>
  <style>
    @font-face { font-family: 'Mincho'; src: url('../fonts/mincho-800.woff2') format('woff2'); font-weight: 800; }
    @font-face { font-family: 'Gothic'; src: url('../fonts/gothic-400.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'Gothic'; src: url('../fonts/gothic-500.woff2') format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Plex Mono'; src: url('../fonts/plexmono-400.woff2') format('woff2'); font-weight: 400; }

    :root { --accent-pick: #e0452b; --accent: var(--accent-pick); }
    body[data-theme="tinta"] { --bg: #1e1b17; --s1: #221f1b; --line2: #3a352e; --text: #ebe3d3; --muted: #8e8679; --faint: #5b544b; }
    body[data-theme="papel"] {
      --bg: #f8f4ec; --s1: #ece5d6; --line2: #c4b9a3; --text: #1d1a16; --muted: #776e61; --faint: #a59b8a;
      --accent: color-mix(in oklab, var(--accent-pick) 82%, black);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font: 400 13px/1.45 'Gothic', 'Yu Gothic UI', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased; user-select: none;
      display: grid; place-items: center;
      border-radius: 11px; box-shadow: inset 0 0 0 1px var(--line2);
    }
    main { width: min(320px, 86vw); display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .45s cubic-bezier(.2, .7, .25, 1); }
    body.on main { opacity: 1; transform: none; }

    .mark { position: relative; width: 112px; height: 112px; display: grid; place-items: center; margin-bottom: 18px; }
    .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .ring { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; filter: url(#rough); transform-origin: 56px 56px; }
    body[data-s="loading"] .ring, body[data-s="slow"] .ring { animation: draw 2.6s cubic-bezier(.45, 0, .2, 1) infinite, spin 7.8s linear infinite; }
    body:not([data-s="loading"]):not([data-s="slow"]) .ring { stroke: var(--faint); stroke-dashoffset: 44; transform: rotate(-70deg); transition: stroke-dashoffset .9s cubic-bezier(.2, .7, .25, 1); }
    @keyframes draw { 0% { stroke-dashoffset: 289; } 55% { stroke-dashoffset: 34; } 100% { stroke-dashoffset: -255; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot { position: absolute; right: 13px; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .4s cubic-bezier(.22, .9, .28, 1.08) .3s; }
    body:not([data-s="loading"]):not([data-s="slow"]) .dot { transform: scale(1); }

    #ic { width: 46px; height: 46px; object-fit: contain; border-radius: 12px; }
    #ini { font: 800 34px/1 'Mincho', Georgia, serif; color: var(--text); }
    h1 { font: 800 21px/1.2 'Mincho', 'Yu Mincho', Georgia, serif; margin: 0 0 4px; letter-spacing: .01em; }
    .host { font: 400 11px/1.4 'Plex Mono', Consolas, monospace; color: var(--faint); margin-bottom: 14px; word-break: break-all; }
    #msg { font-weight: 500; margin: 0; }
    #det { color: var(--muted); margin: 6px 0 0; }
    #code { font: 400 11px/1.4 'Plex Mono', Consolas, monospace; color: var(--faint); margin: 8px 0 0; }
    body[data-s="loading"] #msg::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
    @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    #acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
    #acts:empty { display: none; }
    .btn { font: 500 12.5px/1 'Gothic', 'Segoe UI', sans-serif; color: var(--text); background: none; border: 1px solid var(--line2); border-radius: 999px; padding: 9px 15px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
    .btn:hover { background: var(--s1); }
    .btn:active { transform: scale(.97); }
    .btn.main { background: var(--accent); border-color: transparent; color: #fff; }
    .btn.main:hover { filter: brightness(1.08); background: var(--accent); }
    .link { margin-top: 14px; font: 400 11.5px/1 'Gothic', 'Segoe UI', sans-serif; color: var(--faint); background: none; border: 0; padding: 4px 6px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .link:hover { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-theme="tinta" data-s="loading">
  <main>
    <div class="mark">
      <svg viewBox="0 0 112 112" aria-hidden="true">
        <defs>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
          </filter>
        </defs>
        <circle class="ring" cx="56" cy="56" r="46"/>
      </svg>
      <span class="dot"></span>
      <img id="ic" alt="" hidden>
      <span id="ini" hidden></span>
    </div>
    <h1 id="name"></h1>
    <div class="host" id="host"></div>
    <p id="msg">Carregando</p>
    <p id="det" hidden></p>
    <p id="code" hidden></p>
    <div id="acts"></div>
    <button class="link" id="copy" hidden>Copiar detalhes</button>
  </main>
  <script src="cover.js"></script>
</body>
</html>
