<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; font-src 'self' file:; img-src data: nanquim:">
  <title>senha</title>
  <style>
    @font-face { font-family: 'Mincho'; src: url('../fonts/mincho-800.woff2') format('woff2'); font-weight: 800; }
    @font-face { font-family: 'Gothic'; src: url('../fonts/gothic-400.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'Gothic'; src: url('../fonts/gothic-500.woff2') format('woff2'); font-weight: 500; }
    @font-face { font-family: 'Plex Mono'; src: url('../fonts/plexmono-400.woff2') format('woff2'); font-weight: 400; }
    :root { --accent-pick: #e0452b; --accent: var(--accent-pick); }
    body[data-theme="tinta"] { --bg: #1d1a17; --s1: #26221e; --line: #332e28; --line2: #3f3932; --text: #ebe3d3; --muted: #9a9286; --faint: #6a6258; }
    body[data-theme="papel"] { --bg: #fbf8f2; --s1: #efe8da; --line: #ddd4c3; --line2: #cfc4b0; --text: #1d1a16; --muted: #6f675b; --faint: #a59b8a; --accent: color-mix(in oklab, var(--accent-pick) 82%, black); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 400 13px/1.4 'Gothic', 'Segoe UI', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; }
    .card { margin: 0; padding: 16px 16px 14px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .28s cubic-bezier(.2, .7, .25, 1); }
    body.on .card { opacity: 1; transform: none; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .key { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--s1); color: var(--accent); }
    .key svg { width: 17px; height: 17px; }
    h1 { font: 800 16.5px/1.2 'Mincho', 'Yu Mincho', Georgia, serif; margin: 0; }
    .host { font: 400 11.5px/1.3 'Plex Mono', Consolas, monospace; color: var(--muted); margin-top: 2px; word-break: break-all; }
    .x { margin-left: auto; align-self: flex-start; width: 26px; height: 26px; border: 0; background: none; color: var(--faint); border-radius: 7px; display: grid; place-items: center; cursor: pointer; }
    .x:hover { background: var(--s1); color: var(--text); }
    .x svg { width: 13px; height: 13px; }
    label { display: block; color: var(--muted); font-size: 11.5px; margin: 8px 0 4px; }
    .f { position: relative; }
    input { width: 100%; height: 34px; border-radius: 9px; border: 1px solid var(--line2); background: var(--s1); color: var(--text); padding: 0 34px 0 10px; font: 400 13px 'Gothic', 'Segoe UI', sans-serif; outline: none; user-select: text; }
    input:focus { border-color: var(--accent); }
    input.pw { font-family: 'Plex Mono', Consolas, monospace; letter-spacing: .06em; }
    .eye { position: absolute; right: 4px; top: 4px; width: 26px; height: 26px; border: 0; background: none; color: var(--faint); border-radius: 7px; display: grid; place-items: center; cursor: pointer; }
    .eye:hover { color: var(--text); }
    .eye svg { width: 16px; height: 16px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
    .btn { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: none; color: var(--text); font: 500 12.5px 'Gothic', 'Segoe UI', sans-serif; cursor: pointer; }
    .btn:hover { background: var(--s1); }
    .btn.main { background: var(--accent); border-color: transparent; color: #fff; }
    .btn.main:hover { filter: brightness(1.08); }
    .never { margin-left: auto; border: 0; background: none; color: var(--faint); font: 400 11.5px 'Gothic', 'Segoe UI', sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }
    .never:hover { color: var(--muted); }
    .note { margin-top: 10px; color: var(--faint); font-size: 11px; }
  </style>
</head>
<body data-theme="tinta">
  <div class="card" id="card">
    <div class="head">
      <span class="key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg></span>
      <div><h1 id="title">Salvar senha?</h1><div class="host" id="host"></div></div>
      <button class="x" id="x" title="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <label for="u">E-mail ou usuário</label>
    <input id="u" spellcheck="false" autocomplete="off">
    <label for="p">Senha</label>
    <div class="f">
      <input id="p" class="pw" type="password" readonly>
      <button class="eye" id="eye" title="Mostrar a senha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
    </div>
    <div class="row">
      <button class="btn main" id="save">Salvar</button>
      <button class="btn" id="later">Agora não</button>
      <button class="never" id="never">Nunca neste site</button>
    </div>
    <div class="note">Fica guardada criptografada pelo Windows, só neste computador.</div>
  </div>
  <script src="pwbubble.js"></script>
</body>
</html>
